# ===== Profile =====
spring.profiles.active=db-local

# ===== Server =====
server.port=8080
server.url=${SERVER_URL}

# ===== MySQL =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ===== Redis =====
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# ===== JWT =====
jwt.secret.key=${JWT_SECRET_KEY}

# ===== Kakao OAuth =====
kakao.client-id=${KAKAO_CLIENT_ID}
kakao.redirect_url=${KAKAO_REDIRECT_URL}

# ===== Redash API =====
redash.api-key.genre-region=${REDASH_API_KEY_GENRE_REGION}
redash.api-key.top-ten=${REDASH_API_KEY_TOP_TEN}
redash.api-key.region=${REDASH_API_KEY_REGION}

# ===== KOPIS API =====
kopis.api.base-url=http://kopis.or.kr/openApi/restful/pblprfr/
kopis.api.service-key=${KOPIS_API_SERVICE_KEY}

# ===== Logging =====
logging.level.com.example.calenduck=INFO
